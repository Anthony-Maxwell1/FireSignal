<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <script src="index.js"></script>
    <title>FireSignal - Organization Portal</title>
</head>
<body>
    <div id="sign_in">
        <form name="organization_key">
            <input name="key" class="key">
            <button class="submit" type="submit">Sign In</button>
        </form>
    </div>

    <div id="main" class="hidden">
        <div class="container">
            <div id="users" class="list"></div>
            <button class="acc-option" onclick="create()">New Account</button>
        </div>
        <div class="account-controls">
            <button class="acc-option" onclick="delete_acc()">Delete Account</button>

            <div class="edit_acc">
                <input class="input" id="newUsername" placeholder="New Username" disabled>
                <input class="input" id="newPassword" placeholder="New Password" disabled>
                <button class="edit_submit" onclick="edit()">Edit Account</button>
            </div>
        </div>
    </div>
</body>
</html>
